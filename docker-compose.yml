services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/backend/data/app.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      AUTH_REQUIRED_FOR_SUBMIT: ${AUTH_REQUIRED_FOR_SUBMIT:-false}
      AUTH_REQUIRED_PROVIDER: ${AUTH_REQUIRED_PROVIDER:-google}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      RESPONSE_WEBHOOK_URL: ${RESPONSE_WEBHOOK_URL:-}
      RESPONSE_WEBHOOK_SECRET: ${RESPONSE_WEBHOOK_SECRET:-}
      RESPONSE_WEBHOOK_ENABLED: ${RESPONSE_WEBHOOK_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - backend_data:/app/backend/data
      - backend_uploads:/app/backend/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  urls:
    image: alpine:3.20
    depends_on:
      - backend
      - frontend
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    command:
      - sh
      - -c
      - |
        BASE="$${PUBLIC_BASE_URL:-$${FRONTEND_ORIGIN:-http://localhost:8080}}"
        BASE="$${BASE%/}"
        echo ""
        echo "============================================"
        echo " Questly URLs"
        echo "============================================"
        echo "Admin Dashboard:       $$BASE/"
        echo "API Health:            $$BASE/api/health"
        echo "Public form:           $$BASE/q/<slug>  (after DOCX upload)"
        echo "Anonymous form:        $$BASE/q/<slug>?auth=open"
        echo "Dashboard:             $$BASE/dashboard/<slug>"
        echo "Google OAuth Redirect: $$BASE/api/auth/callback/google"
        echo "============================================"
        echo "Add the Google OAuth Redirect URI above in Google Cloud Console."
        echo "If using quick tunnel, replace base with current tunnel URL and add that callback URI."
        echo ""

volumes:
  backend_data:
  backend_uploads:
