services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/backend/data/app.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      AUTH_REQUIRED_FOR_SUBMIT: ${AUTH_REQUIRED_FOR_SUBMIT:-false}
      AUTH_REQUIRED_PROVIDER: ${AUTH_REQUIRED_PROVIDER:-google}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      RESPONSE_WEBHOOK_URL: ${RESPONSE_WEBHOOK_URL:-}
      RESPONSE_WEBHOOK_SECRET: ${RESPONSE_WEBHOOK_SECRET:-}
      RESPONSE_WEBHOOK_ENABLED: ${RESPONSE_WEBHOOK_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - backend_data:/app/backend/data
      - backend_uploads:/app/backend/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  urls:
    image: alpine:3.20
    depends_on:
      - backend
      - frontend
    environment:
      LOCAL_BASE: ${LOCAL_BASE:-http://localhost:8080}
      CLOUDFLARED_LOG: ${CLOUDFLARED_LOG:-/out/cloudflared.err.log}
    volumes:
      - ./:/out
    command:
      - sh
      - -c
      - |
        BASE="$${LOCAL_BASE:-http://localhost:8080}"
        BASE="$${BASE%/}"
        CF_LOG="$${CLOUDFLARED_LOG:-/out/cloudflared.err.log}"
        CF=""
        if [ -f "$$CF_LOG" ]; then
          CF=$$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$$CF_LOG" | tail -n1 || true)
        fi
        if [ -n "$$CF" ]; then
          CF_ADMIN="$$CF/"
          CF_REDIRECT="$$CF/api/auth/callback/google"
        else
          CF="(not detected)"
          CF_ADMIN="(not detected)"
          CF_REDIRECT="(not detected - add after tunnel starts)"
        fi
        cat > /out/starting.log <<EOF
        Admin Dashboard (Local): $$BASE/
        Admin Dashboard (Cloudflare): $$CF_ADMIN
        Google OAuth Redirect URL (Local): $$BASE/api/auth/callback/google
        Google OAuth Redirect URL (Cloudflare): $$CF_REDIRECT
        Cloudflare URL: $$CF
        EOF
        echo "Wrote starting.log"
        cat /out/starting.log

volumes:
  backend_data:
  backend_uploads:
